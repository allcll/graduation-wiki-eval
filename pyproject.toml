[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graduation-wiki-eval"
version = "0.1.0"
description = "Evaluate graduation-policy answers and compare wiki and skill revisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
grad-eval = "graduation_wiki_eval.cli:main"

[project.urls]
Repository = "https://github.com/allcll/graduation-wiki-eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graduation_wiki_eval = ["sample/*.jsonl", "sample/context/*.md"]
