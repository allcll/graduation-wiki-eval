name: evaluation-preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: evaluation-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run the public fixture without a model
        run: node scripts/evaluate-ci.mjs --mode sample --out ci-evaluation
      - name: Publish counts only
        if: ${{ !cancelled() && hashFiles('ci-evaluation/public/public-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-public-summary
          path: ci-evaluation/public/public-summary.json
          if-no-files-found: error
          retention-days: 7

# No API key, environment or write token is exposed to PR code. The separate
# workflow_run workflow handles the comment from the trusted default branch.
