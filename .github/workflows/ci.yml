name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Exercise the installed CLI without a model
        run: |
          cd "${{ runner.temp }}"
          grad-eval demo --out demo
          grad-eval report --cases demo/cases.jsonl --runs demo/experiment/runs.jsonl --plan demo/experiment/plan.json --out demo/rechecked.json
      - name: Build distribution
        run: python -m pip wheel --no-deps . --wheel-dir dist
